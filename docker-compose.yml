services:
  db:
    image: postgres:16-alpine
    container_name: family_expense_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-family_expense_manager}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-family_expense_manager}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - expense_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family_expense_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Route database connection to docker service hostname
      POSTGRES_SERVER: db
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - expense_network

volumes:
  postgres_data:
    name: family_expense_pgdata

networks:
  expense_network:
    name: family_expense_network
    driver: bridge
